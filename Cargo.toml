[workspace]
resolver = "2"
members = [
  "crates/ariadne-core",
  "crates/ariadne-storage",
  "crates/ariadne-protocol",
  "crates/ariadne-platform-windows",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tahamoeini/ariadne"

[workspace.dependencies]
ariadne-core = { path = "crates/ariadne-core" }
ariadne-protocol = { path = "crates/ariadne-protocol" }
ariadne-storage = { path = "crates/ariadne-storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
